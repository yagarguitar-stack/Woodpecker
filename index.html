<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Woodpecker</title>
<style>
  :root{
    /* --- 紙とインク。差し色は1色だけ --- */
    --paper:#f4f2ea;
    --paper-deep:#eae6da;
    --card:#fbfaf5;
    --ink:#1b1a16;
    --ink-soft:#494640;
    --stave:#3a3730;
    --muted:#8b8578;
    --rule:#d6d0c0;
    --rule-fine:#e6e1d3;
    --accent:#8e2f39;
    --accent-deep:#75252d;
    --accent-soft:#f2e7e6;
    --good:#40573c;
    --good-soft:#e9eee4;
    --bad:#8e2f39;
    --bad-soft:#f2e7e6;
    --line:#d6d0c0;
    --bar-fill:#3a3730;

    --sans:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',system-ui,-apple-system,sans-serif;
    --serif:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Hiragino Kaku Gothic ProN',serif;
    --num:'Iowan Old Style','Palatino Linotype','Palatino','Georgia',var(--serif);

    /* --- 余白は4pxの倍数 --- */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
    --s6:32px; --s7:48px; --s8:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-size:15px; line-height:1.5;
    padding:0 0 var(--s8);
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 var(--s4);}
  button{font-family:inherit;color:inherit;}
  ::selection{background:var(--accent-soft);}
  /* キーボード操作のときだけ枠を出す */
  :focus{outline:none;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  /* ============ ヘッダ ============ */
  header{padding:var(--s7) 0 0;transition:padding .2s ease;}
  .ttl{margin:0;line-height:0;}
  .ttl #logo{display:block;width:300px;max-width:100%;height:auto;transition:width .2s ease;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .ttl-sub{
    color:var(--muted);font-size:11.5px;margin:var(--s3) 0 0;
    letter-spacing:.24em;transition:opacity .2s,height .2s,margin .2s;
  }
  .headrule{border:0;border-top:1px solid var(--ink);margin:var(--s5) 0 0;transition:margin .2s;}

  /* 節を読んでいるあいだは、ヘッダを1行に畳む */
  body.reading header{padding:var(--s5) 0 0;}
  body.reading .ttl #logo{width:150px;}
  body.reading .ttl-sub{height:0;opacity:0;margin:0;overflow:hidden;}
  body.reading .headrule{margin:var(--s3) 0 0;}

  .topbar{
    position:sticky;top:0;z-index:5;background:var(--paper);
    padding:var(--s3) 0 0;margin-bottom:var(--s2);
    box-shadow:0 8px 12px -10px rgba(27,26,22,.18);
  }
  .topbar-in{display:flex;align-items:center;gap:var(--s4);padding-bottom:var(--s3);}
  .backbtn{
    background:none;border:0;padding:var(--s2) 0;cursor:pointer;
    color:var(--ink-soft);font-size:13px;letter-spacing:.06em;
    border-bottom:1px solid transparent;transition:border-color .15s,color .15s;
  }
  .backbtn:hover{color:var(--ink);border-bottom-color:var(--ink);}
  .crumb{color:var(--muted);font-size:11.5px;letter-spacing:.1em;margin-left:auto;}
  .readbar{height:2px;background:var(--rule-fine);}
  .readbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .1s linear;}

  /* ============ 目次 ============ */
  .toc-lead{
    color:var(--muted);font-size:13px;line-height:1.95;margin:var(--s5) 0 var(--s5);
    max-width:54ch;
  }
  .resume{
    display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;
    padding:var(--s4) 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);
    margin:0 0 var(--s6);
  }
  .resume .lbl{font-size:11px;letter-spacing:.14em;color:var(--muted);}
  .resume button{
    background:none;border:0;padding:0;cursor:pointer;font-family:var(--serif);
    font-size:17px;border-bottom:1px solid var(--accent);color:var(--ink);
    transition:color .15s;
  }
  .resume button:hover{color:var(--accent);}

  /* 全体の進み具合 */
  .overall{
    display:flex;align-items:flex-end;gap:var(--s5);flex-wrap:wrap;
    border-top:3px solid var(--ink);border-bottom:1px solid var(--rule);
    padding:var(--s4) 0 var(--s4);margin:0 0 var(--s5);
  }
  .overall .big{font-family:var(--num);font-size:3rem;line-height:.95;margin:0;
                font-variant-numeric:lining-nums;}
  .overall .big span{font-size:.36em;color:var(--muted);margin-left:.25em;letter-spacing:.06em;}
  .overall .lbl{font-size:10.5px;letter-spacing:.2em;color:var(--muted);margin:0 0 var(--s1);}
  .overall .col{display:flex;flex-direction:column;}
  .overall .ticks{margin-left:auto;padding-bottom:var(--s1);}

  /* 目盛り（1本＝1節） */
  .ticks{display:flex;gap:3px;align-items:flex-end;}
  .ticks i{display:block;width:3px;height:15px;background:var(--rule);}
  .ticks i.on{background:var(--accent);}
  .ticks i.sp{width:7px;background:none;}
  .ticks.mini i{width:2px;height:10px;}
  .ticks.mini i.on{background:var(--ink);}

  .part{margin:0 0 var(--s6);}
  .part-head{
    display:flex;align-items:center;gap:var(--s3);width:100%;
    background:none;border:0;border-bottom:2px solid var(--ink);
    padding:0 0 var(--s3);cursor:pointer;text-align:left;
  }
  .part-no{
    font-family:var(--num);font-size:12px;letter-spacing:.16em;color:var(--accent);flex:none;
  }
  .part-ttl{font-family:var(--serif);font-size:23px;font-weight:400;margin:0;letter-spacing:.06em;}
  .part-tag{
    font-size:10px;letter-spacing:.16em;color:var(--muted);flex:none;
    border:1px solid var(--rule);padding:2px var(--s2);
  }
  .part-state{margin-left:auto;font-size:11px;color:var(--muted);flex:none;letter-spacing:.06em;}
  .part-head .ticks{flex:none;}
  .part.complete .part-state{color:var(--accent);}
  .part-caret{flex:none;font-size:9px;color:var(--muted);width:12px;text-align:center;
              transition:transform .18s;}
  .part.closed .part-caret{transform:rotate(-90deg);}
  .seclist,.part-note{
    overflow:hidden;
    transition:max-height .25s ease,opacity .2s ease,margin .25s ease;
    max-height:1200px;opacity:1;
  }
  .part.closed .seclist,.part.closed .part-note{
    max-height:0;opacity:0;margin-top:0;margin-bottom:0;
  }
  .part-note{color:var(--muted);font-size:12px;margin:var(--s3) 0 0;line-height:1.9;max-width:52ch;}

  .seclist{list-style:none;margin:var(--s2) 0 0;padding:0;}
  .seclist li + li{border-top:1px solid var(--rule-fine);}
  .secbtn{
    width:100%;display:flex;align-items:center;gap:var(--s3);background:none;border:0;
    padding:var(--s4) 0;text-align:left;cursor:pointer;font-size:15px;
    transition:color .15s,padding-left .15s,background .15s;
  }
  .secbtn:hover{color:var(--accent);padding-left:var(--s2);}
  /* 状態の丸：空＝未修了、塗り＝修了 */
  .secbtn .mk{
    flex:none;width:10px;height:10px;border-radius:50%;
    border:1px solid var(--rule);background:none;transition:background .15s,border-color .15s;
  }
  .secbtn .n{font-family:var(--num);font-size:12.5px;color:var(--muted);flex:none;
             width:2.8em;letter-spacing:.06em;font-variant-numeric:oldstyle-nums;}
  .secbtn .t{flex:1;color:var(--ink-soft);}
  .secbtn .done{flex:none;font-size:10px;color:var(--accent);letter-spacing:.18em;}
  /* 修了した節 */
  .secbtn.is-done .mk{background:var(--accent);border-color:var(--accent);}
  .secbtn.is-done .n{color:var(--ink);}
  .secbtn.is-done .t{color:var(--ink);font-weight:600;}

  /* ============ 本文 ============ */
  .sec-head{margin:var(--s6) 0 0;}
  .sec-no{
    font-family:var(--num);font-size:11.5px;letter-spacing:.28em;color:var(--accent);
    font-variant-numeric:oldstyle-nums;
  }
  .sec-done{
    display:inline-block;margin-left:var(--s3);font-size:10px;letter-spacing:.18em;
    color:var(--paper);background:var(--accent);padding:2px var(--s2);vertical-align:2px;
  }
  .sec-ttl{font-family:var(--serif);font-size:2.1rem;font-weight:400;margin:var(--s3) 0 0;
           line-height:1.3;letter-spacing:.03em;}
  /* リード＝本文より一段上。導入の声 */
  .lead{font-family:var(--serif);color:var(--ink);font-size:17.5px;line-height:1.95;
        margin:var(--s5) 0 var(--s5);max-width:44ch;}
  .goal{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
        padding:var(--s4) 0;margin:0 0 var(--s6);}
  .goal h4{margin:0 0 var(--s2);font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:.2em;}
  .goal p{margin:0;font-size:14px;line-height:1.95;color:var(--ink-soft);max-width:52ch;}

  .body p{margin:var(--s5) 0;line-height:2.05;max-width:46ch;}
  .body b{font-weight:600;}
  .body .kw{font-weight:600;border-bottom:1px solid var(--accent);padding-bottom:1px;}

  .box{border-left:2px solid var(--ink);padding:var(--s2) 0 var(--s2) var(--s5);
       margin:var(--s5) 0;font-size:14px;color:var(--ink-soft);line-height:2;max-width:48ch;}
  .box .eq{color:var(--ink);font-weight:600;}
  .keybox{margin:var(--s6) 0;border-top:2px solid var(--ink);padding-top:var(--s3);}
  .keybox h4{margin:0 0 var(--s2);font-size:10.5px;color:var(--accent);font-weight:400;letter-spacing:.2em;}
  .keybox p{margin:0;font-size:16px;line-height:1.95;max-width:46ch;font-family:var(--serif);}
  /* 傍注：本文から一段下げて、細い罫を添える */
  .note{
    font-size:12.5px;color:var(--muted);margin:var(--s5) 0 0;line-height:1.95;max-width:44ch;
    padding-left:var(--s5);border-left:1px solid var(--rule-fine);
  }

  /* 譜例 —— 枠も影も置かない */
  .staffwrap{margin:var(--s6) 0;}
  .staffcap{
    font-size:11.5px;color:var(--muted);margin:0 0 var(--s3);letter-spacing:.04em;line-height:1.7;
    text-align:center;
  }
  .stage{display:flex;justify-content:center;overflow-x:auto;padding:var(--s1) 0;}
  .stage svg{display:block;}
  .snote.hl ellipse,.snote.hl line,.snote.hl path,.snote.hl rect,.snote.hl circle{
    fill:var(--accent)!important;stroke:var(--accent)!important;}
  .playrow{display:flex;gap:var(--s4);margin-top:var(--s3);justify-content:center;flex-wrap:wrap;}
  .playbtn{
    background:none;border:0;padding:var(--s1) 0;cursor:pointer;
    color:var(--ink-soft);font-size:12.5px;letter-spacing:.06em;
    border-bottom:1px solid var(--rule);transition:color .15s,border-color .15s;
  }
  .playbtn::before{content:'\25B6 ';font-size:9px;color:var(--accent);}
  .playbtn:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .playbtn[disabled]{opacity:.4;cursor:default;}
  .staffwrap.playing .staffcap{color:var(--accent);}

  .tbl{width:100%;border-collapse:collapse;margin:var(--s5) 0;font-size:13.5px;}
  .tbl th,.tbl td{border-bottom:1px solid var(--rule-fine);padding:var(--s3) var(--s1);
                  text-align:center;vertical-align:middle;}
  .tbl thead th{border-bottom:1px solid var(--ink);color:var(--muted);font-weight:400;
                font-size:10.5px;letter-spacing:.14em;}
  .tbl td.nm{text-align:left;white-space:nowrap;}
  .tbl td.val{font-family:var(--num);font-size:14.5px;}
  .tbl .gl{display:flex;justify-content:center;align-items:center;min-height:46px;}

  .beatgrid{display:flex;gap:var(--s2);margin:var(--s5) 0;flex-wrap:wrap;}
  .bt{flex:1;min-width:56px;border-top:1px solid var(--rule);padding:var(--s3) 0 0;text-align:center;}
  .bt .num{font-family:var(--num);font-size:21px;color:var(--ink-soft);}
  .bt .lv{font-size:10.5px;color:var(--muted);margin-top:var(--s1);letter-spacing:.08em;}
  .bt.strong{border-top:2px solid var(--accent);}
  .bt.strong .num{color:var(--accent);}
  .bt.mid{border-top:1px solid var(--ink);}
  .bt.mid .num{color:var(--ink);}

  .cnt{display:flex;gap:var(--s1);margin:var(--s4) 0;flex-wrap:wrap;}
  .cnt span{flex:1;min-width:34px;text-align:center;padding:var(--s2) 0;font-size:14px;
            font-family:var(--serif);color:var(--muted);border-top:1px solid var(--rule-fine);}
  .cnt span.on{color:var(--accent);border-top:2px solid var(--accent);}

  /* ============ 演習 ============ */
  .quiz{margin:var(--s7) 0 0;}

  /* 入口：本文とはっきり別のものに見せる */
  .qstart{
    background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);
    padding:var(--s5);
  }
  .qstart h3{
    font-family:var(--serif);font-size:19px;font-weight:400;margin:0 0 var(--s3);
    letter-spacing:.22em;color:var(--accent);
  }
  .qstart p{margin:0 0 var(--s5);font-size:13.5px;color:var(--ink-soft);line-height:1.95;max-width:46ch;}
  .qstart p b{color:var(--ink);}
  .qstart .qnav{margin-top:0;}
  /* 主ボタンは朱の面。小さく強い */
  .btn.on-ink{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.on-ink:hover{background:var(--accent-deep,#75252d);border-color:var(--accent-deep,#75252d);color:#fff;}
  .btn.on-ink.ghost{background:none;border-color:var(--rule);color:var(--ink-soft);}
  .btn.on-ink.ghost:hover{background:none;border-color:var(--ink);color:var(--ink);}

  /* 出題中：紙の上に一枚の札を置く */
  .qcard{
    background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);
    box-shadow:5px 5px 0 var(--paper-deep);
  }
  .qbanner{
    display:flex;align-items:center;gap:var(--s3);
    background:var(--paper-deep);color:var(--ink);padding:var(--s3) var(--s5);
    border-bottom:1px solid var(--rule);
  }
  .qbanner h3{
    font-family:var(--serif);font-size:14px;font-weight:400;margin:0;letter-spacing:.28em;
    color:var(--accent);
  }
  .qmeta{
    font-family:var(--num);font-size:13px;color:var(--ink-soft);margin-left:auto;letter-spacing:.1em;
  }
  .qbody{padding:var(--s5);}
  .qprog{display:flex;gap:var(--s1);margin:0 0 var(--s5);}
  .qprog i{flex:1;height:3px;background:var(--rule);}
  .qprog i.on{background:var(--ink-soft);}
  .qprog i.cur{background:var(--accent);}
  .qtext{
    font-family:var(--serif);font-size:19px;line-height:1.85;margin:0 0 var(--s5);max-width:44ch;
  }
  .opts{display:grid;gap:var(--s2);}
  .opt{
    display:flex;align-items:flex-start;gap:var(--s4);width:100%;
    background:var(--paper);border:1px solid var(--rule);
    padding:var(--s4);font-size:15px;text-align:left;cursor:pointer;line-height:1.7;
    transition:border-color .12s,background .12s,transform .08s;
  }
  .opt .kbd{
    flex:none;font-family:var(--num);font-size:13px;color:var(--ink-soft);
    width:1.6em;height:1.6em;line-height:1.5em;text-align:center;
    border:1px solid var(--rule);background:var(--card);
  }
  .opt:hover:not([disabled]){border-color:var(--ink);background:var(--card);}
  .opt:active:not([disabled]){transform:translateY(1px);}
  .opt[disabled]{cursor:default;}
  .opt[disabled]:not(.pick-ok):not(.pick-ng):not(.reveal){opacity:.4;}
  /* 選んだもの・正解を、面と記号ではっきり示す */
  .opt.pick-ok{background:var(--good-soft);border-color:var(--good);border-left-width:5px;}
  .opt.pick-ok .kbd{background:var(--good);border-color:var(--good);color:#fff;}
  .opt.pick-ng{background:var(--bad-soft);border-color:var(--bad);border-left-width:5px;}
  .opt.pick-ng .kbd{background:var(--bad);border-color:var(--bad);color:#fff;}
  .opt.reveal{background:var(--good-soft);border-color:var(--good);border-left-width:5px;}
  .opt.reveal .kbd{background:var(--good);border-color:var(--good);color:#fff;}
  .opt .tagmk{margin-left:auto;flex:none;font-size:11px;letter-spacing:.14em;align-self:center;}
  .opt.pick-ok .tagmk,.opt.reveal .tagmk{color:var(--good);}
  .opt.pick-ng .tagmk{color:var(--bad);}

  .ans{
    margin:var(--s5) 0 0;font-size:14px;line-height:1.95;max-width:46ch;
    padding:var(--s4) var(--s4) var(--s4) var(--s5);
  }
  .ans.ok{background:var(--good-soft);border-left:5px solid var(--good);}
  .ans.ng{background:var(--bad-soft);border-left:5px solid var(--bad);}
  .ans .verdict{
    display:block;font-family:var(--serif);font-size:16px;margin-bottom:var(--s2);letter-spacing:.14em;
  }
  .ans.ok .verdict{color:var(--good);}
  .ans.ng .verdict{color:var(--bad);}
  .qnav{display:flex;gap:var(--s4);margin-top:var(--s5);align-items:center;flex-wrap:wrap;}

  /* 聴き取り問題 */
  .earbox{
    background:var(--paper-deep);border-left:4px solid var(--accent);
    padding:var(--s4) var(--s5);margin:0 0 var(--s5);text-align:center;
  }
  .earlbl{margin:0 0 var(--s3);font-size:12.5px;color:var(--ink-soft);letter-spacing:.06em;}
  .earbtn{background:none;border:1px solid var(--ink);padding:var(--s2) var(--s5);font-size:13px;}
  .earbtn::before{content:'\266A ';color:var(--accent);}
  .earbtn:hover{background:var(--ink);color:var(--paper);}
  .earbox.playing{border-left-color:var(--good);}
  .earbox.playing .earlbl{color:var(--accent);}
  .opts-staff{gap:var(--s3);}
  .opt-staff{align-items:center;padding:var(--s3) var(--s4);}
  .ministaff{flex:1;display:flex;justify-content:center;overflow:hidden;}
  .ministaff svg{max-width:100%;height:auto;transform:scale(.86);transform-origin:left center;}

  .result{padding:var(--s2) 0 0;text-align:center;}
  .result .pct{
    font-family:var(--num);font-size:4rem;line-height:1;margin:0;color:var(--accent);
    font-variant-numeric:lining-nums;
  }
  .result .big{font-size:14px;margin:var(--s3) 0 var(--s1);color:var(--ink);letter-spacing:.1em;}
  .result .sm{font-size:13px;color:var(--muted);margin:0 auto var(--s5);line-height:1.95;max-width:40ch;}
  .result .qnav{justify-content:center;}

  .btn{
    background:none;border:1px solid var(--ink);border-radius:0;
    font-size:13.5px;padding:var(--s3) var(--s5);cursor:pointer;letter-spacing:.08em;
    transition:background .15s,color .15s;
  }
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.ghost{border-color:var(--rule);color:var(--ink-soft);}
  .btn.ghost:hover{background:none;border-color:var(--ink);color:var(--ink);}
  .btn:active{transform:translateY(1px);transition-duration:.05s;}
  .playbtn:active{opacity:.6;}
  .secbtn:active{opacity:.7;}
  .kbdhint{font-size:11px;color:var(--muted);letter-spacing:.06em;}


  .secnav{display:flex;gap:var(--s4);margin:var(--s7) 0 0;border-top:1px solid var(--rule);padding-top:var(--s4);}
  .secnav button{
    flex:1;background:none;border:0;padding:var(--s3) 0;cursor:pointer;text-align:left;
    font-size:13px;color:var(--ink-soft);transition:color .15s;
  }
  .secnav button:hover{color:var(--accent);}
  .secnav button .dir{transition:letter-spacing .15s;}
  .secnav button:hover .dir{letter-spacing:.22em;}
  .secnav button .dir{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.16em;margin-bottom:var(--s1);}
  .secnav button.next{text-align:right;}

  footer{
    text-align:center;color:var(--muted);font-size:11px;letter-spacing:.06em;
    margin-top:var(--s8);padding-top:var(--s4);border-top:1px solid var(--rule-fine);
  }

  .fade{animation:fade .22s ease-out;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

<style>
/* ===== 共通の部品が読めた時だけ効く（body に wp-ds が付く） ===== */
body.wp-ds{
  --paper:var(--ds-paper);
  --paper-deep:color-mix(in srgb,var(--ds-ink) 6%,var(--ds-paper));
  --card:var(--ds-paper);
  --ink:var(--ds-ink);
  --ink-soft:color-mix(in srgb,var(--ds-ink) 84%,var(--ds-paper));
  --stave:var(--ds-ink);
  --muted:color-mix(in srgb,var(--ds-ink) 62%,var(--ds-paper));
  --rule:color-mix(in srgb,var(--ds-ink) 32%,var(--ds-paper));
  --rule-fine:color-mix(in srgb,var(--ds-ink) 16%,var(--ds-paper));
  --line:var(--rule);
  --bar-fill:var(--ds-ink);
  --accent:var(--ds-accent);
  --accent-deep:color-mix(in srgb,var(--ds-accent) 80%,var(--ds-ink));
  --accent-soft:color-mix(in srgb,var(--ds-accent) 13%,var(--ds-paper));
  --wp-good:#2e6b4a;
  --good:var(--wp-good);
  --good-soft:color-mix(in srgb,var(--wp-good) 13%,var(--ds-paper));
  --bad:var(--ds-accent);
  --bad-soft:var(--accent-soft);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:var(--ds-font);
  --serif:var(--ds-font);
  --num:var(--mono);
  overflow:visible;min-height:100vh;
  padding:28px 22px 96px;font-size:15px;line-height:1.5;
}
@media (prefers-color-scheme:dark){ body.wp-ds:not(.ds-day){--wp-good:#8fdcaa} }
body.wp-ds.ds-night{--wp-good:#8fdcaa}
@media (max-width:520px){ body.wp-ds{padding:26px 18px 96px} }
body.wp-ds .wrap{padding:0 10px}
body.wp-ds .ds-tb{z-index:1}
body.wp-ds :focus-visible{outline:1px solid var(--ds-accent);outline-offset:3px}
body.wp-ds button{color:inherit}

/* 見出し */
body.wp-ds header{padding-top:var(--s6)}
body.wp-ds .ttl-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.3em}
body.wp-ds .headrule{border-top:1px solid var(--ink)}
body.wp-ds .topbar{background:var(--paper);box-shadow:none;border-bottom:1px solid var(--ink)}
body.wp-ds .backbtn{border:1px solid var(--ink);padding:6px 14px;font-weight:700;letter-spacing:.12em;color:var(--ink)}
body.wp-ds .backbtn:hover{background:var(--ink);color:var(--paper)}
body.wp-ds .crumb{font-family:var(--mono);font-size:10.5px}

/* 目次 */
body.wp-ds .overall{border-top:1px solid var(--ink)}
body.wp-ds .overall .big{font-weight:500}
body.wp-ds .overall .lbl,body.wp-ds .part-state{font-family:var(--mono)}
body.wp-ds #view{counter-reset:wpp}
body.wp-ds .part{counter-increment:wpp}
body.wp-ds .part-head{border-bottom:1px solid var(--ink)}
body.wp-ds .part-no{font-size:0;letter-spacing:0}
body.wp-ds .part-no::after{content:counter(wpp);display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--ink)}
body.wp-ds .part.complete .part-no::after{background:var(--ink);color:var(--paper)}
body.wp-ds .part-ttl{font-size:18px;font-weight:800;letter-spacing:.14em}
body.wp-ds .part-tag{border-color:currentColor}
body.wp-ds .seclist{border:1px solid var(--ink);border-top:0;margin-top:0}
body.wp-ds .seclist li + li{border-top:1px solid var(--rule)}
body.wp-ds .secbtn{padding:0;gap:0;align-items:stretch;position:relative;isolation:isolate;transition:color .18s}
body.wp-ds .secbtn::before{content:'';position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:-1}
body.wp-ds .secbtn:hover{padding-left:0;color:inherit;background:var(--paper-deep)}
body.wp-ds .secbtn:active{opacity:1}
body.wp-ds .secbtn:active::before{transform:scaleX(1)}
body.wp-ds .secbtn:active *{color:var(--paper)!important}
body.wp-ds .secbtn .mk{display:none}
body.wp-ds .secbtn .n{width:4.2em;padding:12px 0;text-align:center;border-right:1px solid var(--rule);font-variant-numeric:lining-nums tabular-nums;font-size:12px}
body.wp-ds .secbtn .t{padding:12px 12px;align-self:center}
body.wp-ds .secbtn .done{align-self:center;padding:0 12px;font-family:var(--mono);font-weight:500}
body.wp-ds .secbtn.is-done .t{font-weight:700}

/* 本文 */
body.wp-ds .sec-no{font-size:11px;letter-spacing:.3em}
body.wp-ds .sec-ttl{font-size:1.9rem;font-weight:800;letter-spacing:.1em}
body.wp-ds .sec-done{color:var(--paper)}
body.wp-ds .lead{font-size:16.5px}
body.wp-ds .goal{border:1px solid var(--ink);padding:var(--s4)}
body.wp-ds .goal h4,body.wp-ds .keybox h4{font-family:var(--mono);font-weight:500}
body.wp-ds .keybox{border:1px dashed var(--accent);padding:var(--s4)}
body.wp-ds .keybox p{font-weight:700;font-size:15.5px}
body.wp-ds .box{border-left:1px solid var(--ink)}
body.wp-ds .staffwrap{border:1px solid var(--rule);padding:var(--s4) var(--s3)}
body.wp-ds .rhy-slot{--ds-rhy-guide:color-mix(in srgb,var(--ds-ink) 35%,transparent)}
body.wp-ds .tbl th,body.wp-ds .tbl td{border:1px solid var(--rule)}
body.wp-ds .tbl thead th{border:1px solid var(--ink);font-family:var(--mono)}
body.wp-ds .bt .num,body.wp-ds .cnt span{font-family:var(--mono)}

/* ボタン */
body.wp-ds .btn{border:1px solid var(--ink);font-weight:700;letter-spacing:.12em;min-height:44px;position:relative;isolation:isolate;transition:color .18s}
body.wp-ds .btn::after{content:'';position:absolute;inset:-1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:-1}
body.wp-ds .btn:hover{background:var(--paper-deep);color:var(--ink)}
body.wp-ds .btn:active::after{transform:scaleX(1)}
body.wp-ds .btn:active{color:var(--paper)}
body.wp-ds .btn.ghost{border-color:var(--rule)}
body.wp-ds .btn.on-ink{background:none;border-color:var(--ink);color:var(--ink);outline:1px solid var(--rule);outline-offset:3px;min-width:12em}
body.wp-ds .btn.on-ink:hover{background:var(--paper-deep);color:var(--ink);border-color:var(--ink)}
body.wp-ds .btn.on-ink:active{color:var(--paper)}
body.wp-ds .btn.on-ink.ghost{outline:0;border-color:var(--rule)}
body.wp-ds .playbtn{font-weight:700}
body.wp-ds .earbtn:hover{background:var(--paper-deep);color:var(--ink)}

/* 演習 */
body.wp-ds .qstart,body.wp-ds .qcard{border:1px solid var(--ink);box-shadow:none}
body.wp-ds .qstart h3,body.wp-ds .qbanner h3{font-family:var(--ds-font);font-weight:800}
body.wp-ds .qbanner{background:none;border-bottom:1px solid var(--ink)}
body.wp-ds .qtext{font-weight:700;font-size:17px}
body.wp-ds .opt{background:none;border-color:color-mix(in srgb,var(--ds-ink) 45%,var(--ds-paper))}
body.wp-ds .opt .kbd{border-radius:50%;border-color:var(--ink);background:none;color:var(--ink);font-size:11.5px;line-height:1.55em}
body.wp-ds .opt:hover:not([disabled]){background:var(--paper-deep)}
body.wp-ds .opt.pick-ok .kbd,body.wp-ds .opt.reveal .kbd,body.wp-ds .opt.pick-ng .kbd{color:var(--paper)}
body.wp-ds .ans .verdict{font-family:var(--ds-font);font-weight:800}
body.wp-ds .earbox{background:none;border:1px dashed var(--ink);border-left:4px solid var(--accent)}
body.wp-ds .result .pct{font-weight:500}

body.wp-ds .secnav{border-top:1px solid var(--ink)}
body.wp-ds .secnav button .dir{font-family:var(--mono)}
body.wp-ds footer{border-top:1px solid var(--rule);font-family:var(--ds-font)}

/* 共通の部品の「ボタンの素の形」より、こちらの形を優先する */
body.wp-ds .btn{padding:var(--s3) var(--s5)}
body.wp-ds .playbtn{padding:var(--s1) 0;border-bottom:1px solid var(--rule)}
body.wp-ds .earbtn{border:1px solid var(--ink);padding:var(--s2) var(--s5)}
body.wp-ds .part-head{padding:0 0 var(--s3)}
body.wp-ds .secnav button{padding:var(--s3) 0}
body.wp-ds .resume button{border-bottom:1px solid var(--accent)}
body.wp-ds .opt{border:1px solid color-mix(in srgb,var(--ds-ink) 45%,var(--ds-paper));padding:var(--s4)}
body.wp-ds .opt-staff{padding:var(--s3) var(--s4)}
body.wp-ds .opt.pick-ok,body.wp-ds .opt.reveal{background:var(--good-soft);border-color:var(--good);border-left-width:5px}
body.wp-ds .opt.pick-ng{background:var(--bad-soft);border-color:var(--bad);border-left-width:5px}
body.wp-ds .opt.pick-ok .kbd,body.wp-ds .opt.reveal .kbd{background:var(--good);border-color:var(--good)}
body.wp-ds .opt.pick-ng .kbd{background:var(--bad);border-color:var(--bad)}
body.wp-ds .secbtn .n{display:flex;align-items:center;justify-content:center}
@media (max-width:520px){ body.wp-ds{padding:26px 22px 96px} body.wp-ds .wrap{padding:0 8px} }
</style>
</head>

function scoreSplitRestTick(startTick,lenTick,totalTick){

    if(off===0 && length===BU){ push('quarter',false); return; }
    let s=off, e=off+length;
    while(s<e){
      const eStart=Math.floor(s/2)*2;
      if(s===eStart && s+2<=e){ push('eighth',false); s+=2; }
      else { const segEnd=Math.min(eStart+2,e); for(let k=s;k<segEnd;k++) push('sixteenth',false); s=segEnd; }

  while(s<end){
    if(total && s%halfUnit===0 && s+halfUnit<=end && s+halfUnit<=total){ push('half',false); s+=halfUnit; continue; }

function expandTies(seq,totalTick){
  const out=[]; let acc=0;

    if(n.rest){

    }
    barX = bx;
    overZone = `<rect x="${barX}" y="${y0-8}" width="${usable+pad+SIG-barX+4}" height="${4*lineGap+16}" fill="var(--bad)" opacity="0.08"/>`+
      `<text x="${Math.min((barX+usable+pad+SIG)/2, usable+pad+SIG-6)}" y="${y0+4*lineGap+18}" text-anchor="middle" font-size="10" fill="var(--bad)">はみ出し</text>`;
  }
  let lines='';
  for(let i=0;i<5;i++){ const yy=y0+i*lineGap; lines+=`<line x1="0" x2="${usable+pad*2+SIG}" y1="${yy}" y2="${yy}" stroke="var(--stave)" stroke-width="1"/>`;}
  // 拍子記号（分子・分母を縦2段。譜頭の開始線の直後に置く）
  const sigSVG = meterSig ? (
    `<text x="${pad+SIG/2}" y="${y0+lineGap+3}" text-anchor="middle" font-family="var(--sans)" font-weight="700" font-size="16" fill="var(--stave)">${meterSig[0]}</text>`+
    `<text x="${pad+SIG/2}" y="${y0+3*lineGap+4}" text-anchor="middle" font-family="var(--sans)" font-weight="700" font-size="16" fill="var(--stave)">${meterSig[1]}</text>`
  ) : '';
  // 小節線
  // 拍頭ガイド（薄い破線）：拍をまたぐ連桁でも拍の切れ目が一目で分かるように
  let beatGuides='';
  {
    // 音符がまだ無い（空の五線）ときは、小節幅を均等割りして拍の位置を出す
    const tickToX=(tk)=>{
      if(!seq.length) return pad+SIG+usable*(tk/Math.max(totalTick,1));
      let acc=0, xx=pad+SIG;
      for(let i=0;i<seq.length;i++){ if(tk<acc+ticksArr[i]) return xx+widths[i]*((tk-acc)/ticksArr[i]); acc+=ticksArr[i]; xx+=widths[i]; }
      return xx;
    };
    // 複合拍子では「八分3つ」のまとまりに、それ以外は1拍ごとにガイドを引く
    const gUnit = isCompound(meterSig) ? pulseTickOf(meterSig) : T;
    const nGuide=Math.max(1,Math.round(totalTick/gUnit));
    for(let b=1;b<nGuide;b++){
      const gx=tickToX(b*gUnit);
      if(gx>pad+SIG+2 && gx<barX-2){
        beatGuides+=`<line x1="${gx.toFixed(1)}" x2="${gx.toFixed(1)}" y1="${y0}" y2="${y0+4*lineGap}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3" opacity="0.75"/>`;
      }
    }
  }
  lines=`<rect x="0" y="0" width="${usable+pad*2+SIG}" height="${height}" fill="none"/>`+overZone+
        `<line x1="${pad-6}" x2="${pad-6}" y1="${y0}" y2="${y0+4*lineGap}" stroke="var(--stave)" stroke-width="1.4"/>`+
        sigSVG+beatGuides+
        `<line x1="${barX}" x2="${barX}" y1="${y0}" y2="${y0+4*lineGap}" stroke="${overZone?'var(--bad)':'var(--stave)'}" stroke-width="1.4"/>`+lines;
  let notes='';
  const midY=y0+2*lineGap;
  // --- 符頭x座標を事前計算（連桁のグルーピングに使用） ---
  const cxArr=[]; { let xx=pad+SIG; for(let i=0;i<seq.length;i++){ cxArr.push(xx+noteOff); xx+=widths[i]; } }
  // 各音符の開始tick（拍位置判定用）
  const startTick=[]; { let acc=0; for(let i=0;i<seq.length;i++){ startTick.push(acc); acc+=ticksArr[i]; } }
  // --- 連桁グループの決定（opt.beam時） ---
  // まとめ単位は beamUnitOf() が拍子から決める。
  //   4/4・2/4 = 八分は2拍ごと（八分4つで1本）／3/4 = 1拍ごと／6/8 = 八分3つごと。
  //   十六分をふくむ連桁は1拍ごとに区切り、拍を明確にする（複合拍子は3つ割りを優先）。
  const beamOf=new Array(seq.length).fill(null);
  if(opt.beam){
    // パス1：連続する連桁可能音符（八分・十六分）をひとまとまりに（休符・空欄・四分以上で切る）
    const runs=[]; let run=[];
    for(let i=0;i<seq.length;i++){
      const n=seq[i], d=DUR[n.key]||{base:'quarter',tick:48};
      const beamable = !n.rest && !n.blank && (d.base==='eighth'||d.base==='sixteenth');
      if(beamable) run.push(i); else { if(run.length) runs.push(run); run=[]; }
    }
    if(run.length) runs.push(run);
    // パス2：各runを beamUnitOf() の単位で分割する。
    runs.forEach(r=>{
      const hasSixteenth = r.some(gi=>(DUR[seq[gi].key]||{}).base==='sixteenth');
      const unit = beamUnitOf(meterSig, hasSixteenth);
      let sub=[];
      const flushSub=()=>{ if(sub.length>=2){ const g=sub.slice(); g.forEach(gi=>beamOf[gi]=g); } sub=[]; };
      r.forEach(gi=>{
        if(sub.length && Math.floor(startTick[gi]/unit)!==Math.floor(startTick[sub[0]]/unit)) flushSub();
        sub.push(gi);
      });
      flushSub();
    });
  }
  // 符幹の先端y（符頭中心midYからの相対）。連桁時はグループ内で統一
  const STEM_TOP=-24;
  seq.forEach((n,idx)=>{
    const d=DUR[n.key]||{base:'quarter',dots:0,tick:48};
    const slotW = widths[idx];
    const cx=x+noteOff;
    const col = n.mark==='ok'?'var(--good)':n.mark==='ng'?'var(--bad)':'var(--ink)';
    const beamed = beamOf[idx];
    const src = (n._src!=null) ? n._src : idx;   // ハイライト用：元の音符番号
    if(n.blank){
      notes+=`<rect x="${x+6}" y="${y0-6}" width="${slotW-14}" height="${4*lineGap+12}" rx="7"
        fill="var(--accent-soft)" stroke="var(--accent)" stroke-dasharray="4 3" stroke-width="1.3"/>
        <text x="${cx}" y="${midY+4}" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="var(--accent)">?</text>`;
    }else if(n.rest){
      notes+=`<g class="snote" data-src="${src}" data-cx="${cx.toFixed(1)}" transform="translate(${cx-15},${midY-16})">${restPath(d.base,15,0,col,d.dots)}</g>`;
    }else{
      const filled=(d.base==='eighth'||d.base==='sixteenth'||d.base==='quarter');
      notes+=`<g class="snote" data-src="${src}" data-cx="${cx.toFixed(1)}" transform="translate(${cx},${midY})">
        <g transform="rotate(-20)"><ellipse rx="6" ry="4.5" fill="${filled?col:'none'}"${filled?'':` stroke="${col}" stroke-width="1.8"`}/></g>`;
      if(d.base!=='whole') notes+=`<line x1="5.4" y1="-1" x2="5.4" y2="${STEM_TOP}" stroke="${col}" stroke-width="1.8"/>`;
      // 連桁対象は個別フラッグを描かない（ビームで後からつなぐ）
      if(!beamed){
        if(d.base==='eighth') notes+=flag(5.4,STEM_TOP,col,0);
        if(d.base==='sixteenth') notes+=flag(5.4,STEM_TOP,col,0)+flag(5.4,STEM_TOP,col,7);
      }
      if(d.dots) notes+=`<circle cx="13" cy="1" r="2" fill="${col}"/>`;
      notes+=`</g>`;
    }
    x+=slotW;
  });
  // --- 連桁本体の描画（符幹先端どうしを横棒でつなぐ） ---
  if(opt.beam){
    const seen=new Set();
    const beamY = midY + STEM_TOP;              // ビーム上辺のy（符幹先端）
    const stemX = i => cxArr[i] + 5.4; // 符幹は回転させていないため x=5.4（符頭中心cx基準）ぴったりに合わせる
    seq.forEach((n,idx)=>{
      const g=beamOf[idx];
      if(!g || seen.has(g)) return; seen.add(g);
      const col = n.mark==='ok'?'var(--good)':n.mark==='ng'?'var(--bad)':'var(--ink)';
      const x1=stemX(g[0]), x2=stemX(g[g.length-1]);
      // 1次ビーム（八分＝全員が持つ）
      notes+=`<line x1="${x1.toFixed(1)}" y1="${beamY}" x2="${x2.toFixed(1)}" y2="${beamY}" stroke="${col}" stroke-width="3.4" stroke-linecap="butt"/>`;
      // 2次ビーム（十六分のみ。連続区間ごとに短い横棒、単独なら内側へ跳ねる）
      const y2nd=beamY+5;
      for(let j=0;j<g.length;j++){
        const gi=g[j]; const dd=DUR[seq[gi].key];
        if(dd.base!=='sixteenth') continue;
        const prev16 = j>0 && DUR[seq[g[j-1]].key].base==='sixteenth';
        const next16 = j<g.length-1 && DUR[seq[g[j+1]].key].base==='sixteenth';
        if(next16){
          notes+=`<line x1="${stemX(gi).toFixed(1)}" y1="${y2nd}" x2="${stemX(g[j+1]).toFixed(1)}" y2="${y2nd}" stroke="${col}" stroke-width="3.4"/>`;
        }else if(!prev16){
          // 前後とも十六分でない単独 → 部分ビーム（stub）は拍の内側を向く：
          // 拍の後半にある十六分は左（拍頭側）、前半にある十六分は右（次の音側）。
          // 例）付点八分＋十六分→左向き／十六分＋付点八分→右向き。
          const posInBeat = startTick[gi] % T;
          const dir = (posInBeat >= T/2) ? -1 : 1;
          notes+=`<line x1="${stemX(gi).toFixed(1)}" y1="${y2nd}" x2="${(stemX(gi)+dir*6).toFixed(1)}" y2="${y2nd}" stroke="${col}" stroke-width="3.4"/>`;
        }
      }
    });
  }
  // タイ弧線（ことりノーム流）：分割で生じた同音を弧でつなぐ
  seq.forEach((n,idx)=>{
    if(!n.tie || idx===0) return;
    const px=cxArr[idx-1], cx=cxArr[idx];
    const col = n.mark==='ok'?'var(--good)':n.mark==='ng'?'var(--bad)':'var(--ink)';
    notes+=`<path d="M ${(px+3).toFixed(1)} ${midY+8} Q ${((px+cx)/2).toFixed(1)} ${midY+16} ${(cx-3).toFixed(1)} ${midY+8}" fill="none" stroke="${col}" stroke-width="1.2"/>`;
  });
  return `<svg width="${usable+pad*2+SIG}" height="${height}" viewBox="0 0 ${usable+pad*2+SIG} ${height}" xmlns="http://www.w3.org/2000/svg">${lines}${notes}</svg>`;
}

/* ---------- 音 ----------
   共通の音源（DS.sound）のドラムで鳴らす。割り当ては
     譜例の音 … スネア（1音目はアクセント）
     カウント … ハイハット
   共通の音源が読み込めない時は、これまでの合成音で鳴らす。 */
let AC=null;
function dsSound(){ return (window.DS && DS.sound) ? DS.sound : null; }
function audio(){
  const S=dsSound();
  if(S){ try{ return S.context(); }catch(e){} }   // 共通の音源と同じ器を使う
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==='suspended'){ AC.resume(); }
  return AC;
}
// ドラムの音が用意できてから続きを動かす（先に鳴らすと頭がずれるため）
function withDrums(cb){
  const S=dsSound();
  if(!S || S.isReady('drums')){ cb(); return; }
  S.load('drums').then(cb).catch(cb);
}
// 早めに読み込んでおく
withDrums(function(){});
document.addEventListener('pointerdown', function pre(){
  document.removeEventListener('pointerdown', pre, true); withDrums(function(){});
}, true);
// kind:'count' … カウントイン用の低くこもった音（メトロノームの木の音に近い）
// kind:'note'  … 問題のリズム用の高く明るい音
// 同じ音だと「どこからが問題か」が分からなくなるため、必ず音色を変える。
function click(time, accent, kind){
  const S=dsSound();
  if(S && S.isReady('drums')){
    if(kind==='count') S.drum('hihat', {time:time, vel:accent?0.90:0.62});
    else               S.drum('snare', {time:time, vel:accent?1.00:0.80});
    return;
  }
  const ac=audio(); if(!ac) return;
  const isCount = kind==='count';
  const len = isCount?0.05:0.03, sr=ac.sampleRate, buf=ac.createBuffer(1,Math.round(sr*len),sr);
  const data=buf.getChannelData(0);
  const decay = isCount?10:6;
  for(let i=0;i<data.length;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,decay); }
  const src=ac.createBufferSource(); src.buffer=buf;
  const flt=ac.createBiquadFilter(); flt.type='bandpass';
  flt.frequency.value = isCount ? (accent?1100:820) : (accent?2600:1800);
  flt.Q.value = isCount ? 1.8 : 0.9;
  const g=ac.createGain(); g.gain.value = isCount ? (accent?0.55:0.4) : (accent?0.95:0.6);
  src.connect(flt); flt.connect(g); g.connect(ac.destination);
  src.start(time);
}
// tickシーケンスをテンポで再生
let playTimer=null;
function playSequence(seq, bpm, opt={}){
  withDrums(()=>playSequenceNow(seq, bpm, opt));
}
function playSequenceNow(seq, bpm, opt={}){
  const ac=audio(); if(!ac){ opt.onEnd&&opt.onEnd(); return; }
  const spb=60/bpm;                 // 1拍秒
  const lead=0.12;
  const countBeats = opt.countIn||0;  // カウントイン拍数（0なら無し）
  const cUnit = opt.countUnitTick || T;   // カウント1つぶんのtick（6/8は付点四分＝72）
  const cspb = spb*(cUnit/T);
  const countSec = countBeats*cspb;
  const t0=ac.currentTime+lead+countSec;   // 本編の開始時刻（カウント後）
  // --- カウントイン：各拍でクリック音＋数字コールバック ---
  // 最後の1拍はわざと鳴らさない。拍は流れたまま「間」ができ、問題の頭がはっきり立つ。
  if(countBeats>0){
    const silentLast = countBeats>=3;
    for(let b=0;b<countBeats;b++){
      const ct=ac.currentTime+lead+b*cspb;
      if(!(silentLast && b===countBeats-1)) click(ct, b===0, 'count');  // 頭拍だけアクセント
      if(opt.onCount){
        const remain=countBeats-b;           // 「4・3・2・1」と減っていく数字
        const delayMs=(ct-ac.currentTime)*1000;
        setTimeout(()=>opt.onCount(remain, false), Math.max(0,delayMs));
      }
    }
    // カウント終了＝本編開始の合図（「スタート！」用）
    if(opt.onCount){
      const delayMs=(t0-ac.currentTime)*1000;
      setTimeout(()=>opt.onCount(0, true), Math.max(0,delayMs));
    }
  }
  let acc=0;
  const events=[];
  seq.forEach((n,i)=>{
    // n は文字列キー（'quarter'等）またはオブジェクト（{key,tick,rest}）の両方を許容
    const d = (typeof n==='string') ? DUR[n] : (DUR[n.key]||null);
    const tick = (typeof n==='object' && n.tick!=null) ? n.tick : (d?d.tick:T);
    const isRest = (typeof n==='object') && n.rest;
    const onsetT = t0+(acc/T)*spb;
    if(!isRest) events.push({t:onsetT, accent:i===0});
    // 各音符・休符の頭で、いま鳴っている位置を通知（ハイライト用）
    if(opt.onStep){ const delayMs=(onsetT-ac.currentTime)*1000; setTimeout(()=>opt.onStep(i), Math.max(0,delayMs)); }
    acc+=tick;
  });
  events.forEach(e=>click(e.t, e.accent&&opt.accentFirst, 'note'));
  const totalSec=(acc/T)*spb;
  clearTimeout(playTimer);
  playTimer=setTimeout(()=>{ opt.onEnd&&opt.onEnd(); }, (lead+countSec+totalSec+0.15)*1000);
}

// 譜面を鳴らしつつ、再生位置を示す縦バー（プレイヘッド）をなめらかに滑らせ、
// 通過する音符もハイライトする。container 内の .stage svg すべてにバーを乗せる（2段対応）。
function playStaffBar(seq, bpm, container, onDone){
  withDrums(()=>playStaffBarNow(seq, bpm, container, onDone));
}
function playStaffBarNow(seq, bpm, container, onDone){
  const SVGNS='http://www.w3.org/2000/svg';
  const spb=60/bpm, lead=0.12;
  const totalTick=seq.reduce((s,n)=>s+(n.tick||(DUR[n.key]||{tick:48}).tick),0);
  const total=(totalTick/T)*spb;
  const clearHL=()=>container.querySelectorAll('.snote.hl').forEach(e=>e.classList.remove('hl'));
  const rviews=Array.from(container.querySelectorAll('.rhy-slot')).map(s=>s._rhy).filter(Boolean);   // 共通のリズム譜で描いた譜面
  // 各段：再生時刻→x座標 の区分線形の点列と、バー線を用意
  const bars=rviews.length?[]:Array.from(container.querySelectorAll('.stage svg')).map(svg=>{
    const vb=(svg.getAttribute('viewBox')||'0 0 300 86').split(' ').map(Number);
    const pts=[]; let acc=0;
    seq.forEach((n,i)=>{
      const tick=n.tick||(DUR[n.key]||{tick:48}).tick;
      const el=svg.querySelector(`.snote[data-src="${i}"]`);
      const x=el?parseFloat(el.getAttribute('data-cx')):null;
      pts.push({t:(acc/T)*spb, x}); acc+=tick;
    });
    pts.push({t:(acc/T)*spb, x:vb[2]-16});   // 譜面右端
    for(let k=0;k<pts.length;k++){ if(pts[k].x==null) pts[k].x=(k>0?pts[k-1].x:vb[0]+20); }
    const line=document.createElementNS(SVGNS,'line');
    line.setAttribute('y1','7'); line.setAttribute('y2',String(vb[3]-7));
    line.setAttribute('stroke','var(--accent)'); line.setAttribute('stroke-width','2.4');
    line.setAttribute('stroke-linecap','round'); line.setAttribute('opacity','0.6');
    line.setAttribute('x1',String(pts[0].x)); line.setAttribute('x2',String(pts[0].x));
    svg.appendChild(line);
    return {line, pts};
  });
  const xAt=(pts,t)=>{ if(t<=pts[0].t) return pts[0].x;
    for(let k=0;k<pts.length-1;k++){ if(t<=pts[k+1].t){ const a=pts[k],b=pts[k+1],r=(t-a.t)/((b.t-a.t)||1); return a.x+(b.x-a.x)*r; } }
    return pts[pts.length-1].x; };
  let raf=null, startT=(window.performance&&performance.now?performance.now():Date.now()), done=false;
  const finish=()=>{ if(done) return; done=true; if(raf) cancelAnimationFrame(raf);
    bars.forEach(b=>{ if(b.line.parentNode) b.line.parentNode.removeChild(b.line); }); clearHL(); rviews.forEach(v=>v.clear()); onDone&&onDone(); };
  const now=()=>(window.performance&&performance.now?performance.now():Date.now());
  const animate=()=>{ const el=(now()-startT)/1000 - lead; const tt=Math.max(0,el);
    bars.forEach(b=>{ const x=xAt(b.pts,tt); b.line.setAttribute('x1',String(x)); b.line.setAttribute('x2',String(x)); });
    rviews.forEach(v=>v.cursor(Math.min(tt/spb*DS.rhythm.T.QUARTER, v.total-1)));
    if(el<total+0.15) raf=requestAnimationFrame(animate); };
  raf=requestAnimationFrame(animate);
  playSequence(seq, bpm, {
    accentFirst:true,
    onStep:(i)=>{ clearHL(); container.querySelectorAll(`.snote[data-src="${i}"]`).forEach(e=>e.classList.add('hl'));
      rviews.forEach(v=>v.events.forEach(e=>v.light(e.i, e.ref===i))); },
    onEnd:finish
  });
}

/* ---------- 汎用ユーティリティ ---------- */
const rnd = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

// 指定tick合計になる音符列をランダム生成（バックトラック）
function fillBar(targetTick, pool){
  const keys = pool || ['whole','half','dotHalf','quarter','dotQuarter','eighth','dotEighth','sixteenth'];
  const items = keys.map(k=>({k,tick:DUR[k].tick})).sort((a,b)=>b.tick-a.tick);
  const out=[];
  function bt(rem){
    if(rem===0) return true;
    for(const it of shuffle(items)){
      if(it.tick<=rem){ out.push(it.k); if(bt(rem-it.tick)) return true; out.pop(); }
    }
    return false;
  }
  bt(targetTick);
  return out;
}

// 拍子に合った1小節を生成する。
// 複合拍子(6/8)は「八分3つ＝1拍」のまとまりごとに埋め、拍のまとまりが崩れないようにする。
function fillBarSig(sig, pool){
  if(!isCompound(sig)) return fillBar(barTickOf(sig), pool);
  const unit = pulseTickOf(sig);                       // 72tick＝付点四分
  const usable = pool.filter(k=>DUR[k].tick<=unit);
  const use = usable.length ? usable : ['eighth','quarter','dotQuarter'];
  let out=[];
  for(let i=0;i<pulseCountOf(sig);i++){
    let g=fillBar(unit, use);
    if(!g.length) g=['dotQuarter'];
    out=out.concat(g);
  }
  return out;
}

/* ---- 直前の問題との重複回避 ----
   各モードのキー(mode番号など)ごとに直前の「署名」を覚えておき、
   gen() が同じ署名を返すあいだは作り直す（最大tries回）。 */
const _lastSig = {};
function uniqueGen(tag, gen, sig, tries=12){
  let result = gen();
  for(let i=0; i<tries && sig(result)===_lastSig[tag]; i++){
    result = gen();
  }
  _lastSig[tag] = sig(result);
  return result;
}

<script>

/* ============================================================
   ロゴ（Woodpecker）
   Bravura（SIL OFL 1.1）の符頭を輪郭データとして使用。
   W ／ 音符4つ ／ ecker を左から順に置くので、重なりは起きない。
============================================================ */
const LOGO_SPU=250, LOGO_STEM_TH=0.12, LOGO_NS='http://www.w3.org/2000/svg';
function logoEl(n,a){const e=document.createElementNS(LOGO_NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function logoFin(v){return (typeof v==='number'&&isFinite(v))?v:null;}
function logoGW(n,sp){const b=BRAVURA[n].bb;return (b[2]-b[0])*sp/LOGO_SPU;}
function logoGlyph(n,left,cy,sp,col){
  const g=BRAVURA[n], s=sp/LOGO_SPU, dx=-g.bb[0]*s;
  const w=logoEl('g',{transform:`translate(${(left+dx).toFixed(2)},${cy.toFixed(2)}) scale(${s.toFixed(5)},${(-s).toFixed(5)})`,
                      fill:col,'fill-rule':'evenodd'});
  w.appendChild(logoEl('path',{d:g.d})); return w;
}
function drawLogo(svg){
  if(!svg) return;
  const F=48, FONT="Georgia,'Times New Roman',serif", FW=600;
  const COL='var(--ink)', STAFF='var(--rule)', STEM=2.0;
  const NOTES=['noteheadWhole','noteheadWhole','noteheadHalf','noteheadBlack'];
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const TA={'font-family':FONT,'font-size':F,'font-weight':FW};
  // 計測用の文字は、失敗しても必ず取り除く
  const meas=s=>{
    let t=null, w=null;
    try{ t=logoEl('text',Object.assign({x:0,y:0},TA)); t.textContent=s;
         svg.appendChild(t); w=logoFin(t.getComputedTextLength()); }
    catch(e){}
    finally{ if(t&&t.parentNode) t.parentNode.removeChild(t); }
    if(w) return w;
    const A={W:.96,e:.50,c:.46,k:.53,r:.40};
    return s.split('').reduce((a,c)=>a+(A[c]||.5)*F,0);
  };
  let xh=null, probe=null;
  try{ probe=logoEl('text',Object.assign({x:0,y:0},TA)); probe.textContent='x';
       svg.appendChild(probe); const b=probe.getBBox(); xh=logoFin(b&&b.height); }
  catch(e){}
  finally{ if(probe&&probe.parentNode) probe.parentNode.removeChild(probe); }
  const sp=(xh!==null && xh>F*0.30 && xh<F*0.70)?xh:F*0.48;
  const gap=F*0.02, wW=meas('W'), wTail=meas('ecker'), wN=NOTES.map(n=>logoGW(n,sp));
  const asc=F*0.72, dsc=F*0.21, stemLen=STEM*sp;
  const topMost=Math.min(-stemLen,-(asc-sp/2),-2*sp), botMost=Math.max(stemLen,(dsc+sp/2),2*sp);
  const m=F*0.16, base=-topMost+m+sp/2, yc=base-sp/2, x0=F*0.3;
  let x=x0;
  svg.appendChild(logoEl('text',Object.assign({x:x.toFixed(2),y:base.toFixed(2),fill:COL},TA))).textContent='W';
  x+=wW+gap;
  NOTES.forEach((n,i)=>{
    svg.appendChild(logoGlyph(n,x,yc,sp,COL));
    if(n!=='noteheadWhole'){
      const up=(n==='noteheadHalf');
      const sx=up ? x+wN[i]-LOGO_STEM_TH*sp/2 : x+LOGO_STEM_TH*sp/2;
      svg.appendChild(logoEl('line',{x1:sx.toFixed(2),y1:yc.toFixed(2),x2:sx.toFixed(2),
        y2:(up?yc-stemLen:yc+stemLen).toFixed(2),stroke:COL,'stroke-width':(LOGO_STEM_TH*sp).toFixed(2)}));
    }
    x+=wN[i]+gap;
  });
  svg.appendChild(logoEl('text',Object.assign({x:x.toFixed(2),y:base.toFixed(2),fill:COL},TA))).textContent='ecker';
  const right=x+wTail;
  const pad=sp*0.7, L=x0-pad, R=right+pad, top=yc-2*sp;
  for(let i=0;i<5;i++) svg.insertBefore(logoEl('line',{x1:L.toFixed(1),y1:(top+i*sp).toFixed(1),
    x2:R.toFixed(1),y2:(top+i*sp).toFixed(1),stroke:STAFF,'stroke-width':(0.13*sp).toFixed(2)}),svg.firstChild);
  const vy=Math.min(yc+topMost,base-asc,top)-m, vb=Math.max(yc+botMost,base+dsc,top+4*sp)+m;
  svg.setAttribute('viewBox',`${(L-m).toFixed(1)} ${vy.toFixed(1)} ${(R-L+m*2).toFixed(1)} ${(vb-vy).toFixed(1)}`);
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label','Woodpecker');
}

<script>

"use strict";
/* ============================================================
   リズムの基礎 — 学習ツール
   ★ツール名はこの2行を書き換えるだけで全画面に反映されます
============================================================ */
const APP_NAME = 'Woodpecker';
const APP_SUB  = '拍・音の長さ・ノリを順番に';

/* ---------- 進捗の保存（失敗しても動作は続く） ---------- */
const PKEY = 'rhythm-basics.progress';
let PROG = {};
function loadProg(){
  try{ PROG = JSON.parse(localStorage.getItem(PKEY) || '{}') || {}; }
  catch(e){ PROG = {}; }
}
function saveProg(){
  try{ localStorage.setItem(PKEY, JSON.stringify(PROG)); }catch(e){}
}
const LKEY = 'rhythm-basics.last';
let LAST = null;                 // 最後に開いた節 {p,s}
let OPEN = null;                 // 目次で開いている部（null なら最後に読んだ部）
function loadLast(){
  try{ LAST = JSON.parse(localStorage.getItem(LKEY) || 'null'); }catch(e){ LAST = null; }
}
function saveLast(p,s){
  LAST = {p:p, s:s};
  try{ localStorage.setItem(LKEY, JSON.stringify(LAST)); }catch(e){}
}
/* 正解ずみの問題番号を節ごとに保存する */
const SKEY = 'rhythm-basics.solved';
let SOLVED = {};
function loadSolved(){
  try{ SOLVED = JSON.parse(localStorage.getItem(SKEY) || '{}') || {}; }catch(e){ SOLVED = {}; }
}
function saveSolved(){
  try{ localStorage.setItem(SKEY, JSON.stringify(SOLVED)); }catch(e){}
}
const solvedOf = (p,s) => SOLVED[p + '-' + s] || [];
function addSolved(p,s,i){
  const k = p + '-' + s;
  const a = SOLVED[k] || (SOLVED[k] = []);
  if(a.indexOf(i) < 0){ a.push(i); saveSolved(); }
}
function clearSolved(p,s){ delete SOLVED[p + '-' + s]; saveSolved(); }

const doneKey = (p,s) => p + '-' + s;
const isDone = (p,s) => !!PROG[doneKey(p,s)];
function markDone(p,s){ PROG[doneKey(p,s)] = true; saveProg(); }

/* ---------- 小道具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const normSeq = seq => seq.map(o => typeof o === 'string'
  ? {key:o, tick:DUR[o].tick}
  : Object.assign({}, o, {tick: o.tick != null ? o.tick : DUR[o.key].tick}));

/* 音符・休符の一覧表 */
function durTable(rest){
  const rows = Object.keys(DUR).map(k=>{
    const d = DUR[k];
    const nm = rest ? d.name.replace('音符','休符') : d.name;
    return `<tr><td><div class="gl">${noteGlyph(k,{w:44,h:52,rest:rest})}</div></td>
      <td class="nm">${nm}</td><td class="val">${beatStr(d.tick)}</td></tr>`;
  }).join('');
  return `<table class="tbl"><thead><tr><th>かたち</th><th>名前</th><th>長さ</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function renderBlock(b){
  if(b.t === 'p')    return `<p>${b.h}</p>`;
  if(b.t === 'html') return b.h;
  if(b.t === 'box')  return `<div class="box">${b.h}</div>`;
  if(b.t === 'key')  return `<div class="keybox"><h4>ここだけ覚える</h4><p>${b.h}</p></div>`;
  if(b.t === 'note') return `<p class="note">${b.h}</p>`;
  if(b.t === 'durtable') return durTable(!!b.rest);
  if(b.t === 'fig') return `<div class="staffwrap">
      ${b.cap ? `<p class="staffcap">${b.cap}</p>` : ''}
      <div class="stage">${figSVG(b.kind)}</div></div>`;
  if(b.t === 'staff'){
    const seq = normSeq(b.seq);
    const id = 'st' + Math.random().toString(36).slice(2,9);
    // unit:'dotQuarter' … 付点四分＝指定BPM。再生エンジンは四分基準なので1.5倍して渡す
    const plays = (b.plays||[]).map(p=>{
      const real = p.unit === 'dotQuarter' ? p.bpm * 1.5 : p.bpm;
      return `<button class="playbtn" type="button" data-staff="${id}" data-bpm="${real}">${esc(p.label)}</button>`;
    }).join('');
    const tup = b.tuplets ? ` data-tuplets='${JSON.stringify(b.tuplets)}'` : '';
    const stk = b.strokes ? ` data-strokes="${b.strokes}"` : '';
    const acc = b.accents ? ` data-accents="${b.accents.join(',')}"` : '';
    return `<div class="staffwrap" id="${id}"${tup}${stk}${acc}>
      ${b.cap ? `<p class="staffcap">${b.cap}</p>` : ''}
      <div class="stage">${staffSVG(seq, b.opt||{})}</div>
      ${plays ? `<div class="playrow">${plays}</div>` : ''}
      <script type="application/json" class="seqdata" data-for="${id}">${JSON.stringify(seq)}<\/script>
    </div>`;
  }
  return '';
}


/* ---- 三連符の囲み（描画後に譜面へ足す） ---- */
function decorateTuplets(){
  const NS = 'http://www.w3.org/2000/svg';
  view().querySelectorAll('.staffwrap[data-tuplets]').forEach(wrap=>{
    let spans; try{ spans = JSON.parse(wrap.getAttribute('data-tuplets')); }catch(e){ return; }
    const svg = wrap.querySelector('svg'); if(!svg) return;
    const vb = (svg.getAttribute('viewBox')||'').split(' ').map(Number);
    if(vb.length !== 4) return;
    const grow = 18;
    svg.setAttribute('viewBox', `${vb[0]} ${vb[1]-grow} ${vb[2]} ${vb[3]+grow}`);
    svg.setAttribute('height', String(vb[3]+grow));
    let add = '';
    spans.forEach(sp=>{
      const a = svg.querySelector(`.snote[data-src="${sp.from}"]`);
      const b = svg.querySelector(`.snote[data-src="${sp.to}"]`);
      if(!a || !b) return;
      const x1 = parseFloat(a.getAttribute('data-cx')) - 7;
      const x2 = parseFloat(b.getAttribute('data-cx')) + 7;
      const mid = (x1 + x2) / 2, y = -9;
      add += `<g class="tuplet">
        <path d="M${x1} ${y+6} L${x1} ${y} L${mid-8} ${y}" fill="none" stroke="var(--stave)" stroke-width="1.3"/>
        <path d="M${mid+8} ${y} L${x2} ${y} L${x2} ${y+6}" fill="none" stroke="var(--stave)" stroke-width="1.3"/>
        <text x="${mid}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--stave)">${sp.label||'3'}</text>
      </g>`;
    });
    if(add) svg.innerHTML = svg.innerHTML + add;
  });
}


/* ---- ストロークの向き（∏／∨）とアクセントを譜面に足す ---- */
function decorateMarks(){
  view().querySelectorAll('.staffwrap[data-strokes], .staffwrap[data-accents]').forEach(wrap=>{
    const svg = wrap.querySelector('svg'); if(!svg) return;
    const cxOf = i => {
      const n = svg.querySelector(`.snote[data-src="${i}"]`);
      return n ? parseFloat(n.getAttribute('data-cx')) : null;
    };
    let add = '';
    const acc = wrap.getAttribute('data-accents');
    if(acc){
      acc.split(',').forEach(v=>{
        const x = cxOf(+v); if(x==null) return;
        add += `<text class="accmark" x="${x}" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="var(--accent)">&gt;</text>`;
      });
    }
    const stk = wrap.getAttribute('data-strokes');
    if(stk){
      const yTop = 62, yBot = 71;
      [...stk].forEach((c,i)=>{
        const x = cxOf(i); if(x==null) return;
        const dim = (c === 'x' || c === 'X');
        const up  = (c === 'U' || c === 'u');
        const col = 'var(--stave)';
        const op  = dim ? '0.3' : '0.85';
        const d = up
          ? `M${x-4.5} ${yTop} L${x} ${yBot} L${x+4.5} ${yTop}`
          : `M${x-4.5} ${yBot} L${x-4.5} ${yTop} L${x+4.5} ${yTop} L${x+4.5} ${yBot}`;
        add += `<path class="stroke-mark" d="${d}" fill="none" stroke="${col}" stroke-width="1.6" opacity="${op}"/>`;
      });
    }
    if(add) svg.innerHTML = svg.innerHTML + add;
  });
}

/* ---- リズム譜・スラッシュ譜の図 ---- */
function figSVG(kind){
  const W = 340, y0 = 14, gap = 8, H = 86;
  const ink = 'var(--ink)', st = 'var(--stave)';
  let g = '';
  for(let i=0;i<5;i++){ const y = y0+i*gap;
    g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="${st}" stroke-width="1"/>`; }
  const bar = x => `<line x1="${x}" x2="${x}" y1="${y0}" y2="${y0+4*gap}" stroke="${st}" stroke-width="1.4"/>`;
  const slash = x => `<line x1="${x-7}" y1="${y0+3*gap}" x2="${x+7}" y2="${y0+gap}" stroke="${ink}" stroke-width="6"/>`;
  const cross = x => `<g stroke="${ink}" stroke-width="2.6" stroke-linecap="round">
      <line x1="${x-5.5}" y1="${y0+2.7*gap}" x2="${x+5.5}" y2="${y0+1.3*gap}"/>
      <line x1="${x-5.5}" y1="${y0+1.3*gap}" x2="${x+5.5}" y2="${y0+2.7*gap}"/></g>`;
  const stem = x => `<line x1="${x+6.5}" y1="${y0+gap-1}" x2="${x+6.5}" y2="4" stroke="${ink}" stroke-width="1.8"/>`;
  const beam = (xa,xb) => `<line x1="${xa+6.5}" y1="4.9" x2="${xb+6.5}" y2="4.9" stroke="${ink}" stroke-width="4"/>`;
  g += bar(2) + bar(W-2);
  if(kind === 'slash'){
    [50,124,198,272].forEach(x => { g += slash(x); });
  }else if(kind === 'rhythmslash'){
    const p = [50,120,158,232,296];
    g += slash(p[0]) + stem(p[0]);
    g += slash(p[1]) + stem(p[1]) + slash(p[2]) + stem(p[2]) + beam(p[1],p[2]);
    g += slash(p[3]) + stem(p[3]);
    g += slash(p[4]) + stem(p[4]);
  }else if(kind === 'mute'){
    const p = [50,124,198,272];
    g += slash(p[0]) + stem(p[0]);
    g += cross(p[1]) + stem(p[1]);
    g += slash(p[2]) + stem(p[2]);
    g += cross(p[3]) + stem(p[3]);
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

    }
    const items = (p.plan||[]).map((t,i)=>`<li>
      <button class="secbtn" type="button" disabled>
        <span class="n">${p.no}-${i+1}</span><span class="t">${esc(t)}</span><span class="done"></span>
      </button></li>`).join('');
    return `<section class="part pending">
      <div class="part-head">
        <span class="part-no">第${p.no}部</span>
        <h2 class="part-ttl">${esc(p.title)}</h2>
        <span class="part-state">準備中</span>
      </div>
      <ul class="seclist">${items}</ul>
    </section>`;
  }).join('');

  // 全32節の進み具合
  let doneAll = 0, totalAll = 0, allTicks = '', maxQuiz = 0;
  const readyParts = PARTS.filter(p=>p.ready).length;
  PARTS.forEach((p,pi)=>{
    if(!p.ready) return;
    if(allTicks) allTicks += '<i class="sp"></i>';
    p.sections.forEach(s=>{
      totalAll++;
      maxQuiz = Math.max(maxQuiz, s.quiz.length);
      const dn = isDone(p.no, s.no);
      if(dn) doneAll++;
      allTicks += `<i class="${dn?'on':''}"></i>`;
    });
  });
  const overall = `<div class="overall">
    <div class="col">
      <p class="lbl">修了した節</p>
      <p class="big">${doneAll}<span>/ ${totalAll}</span></p>
    </div>
    <span class="ticks">${allTicks}</span>
  </div>`;

  let resume = '';
  if(LAST){
    const lp = PARTS.find(p=>p.no===LAST.p);
    const ls = lp && lp.sections && lp.sections.find(s=>s.no===LAST.s);
    if(ls) resume = `<div class="resume">
      <span class="lbl">つづきから読む</span>
      <button type="button" id="resumeBtn">${LAST.p}·${LAST.s}　${esc(ls.title)}</button>
    </div>`;
  }
  view().className = 'fade';
  view().innerHTML = `
    ${overall}
    <p class="toc-lead">リズムを、拍の感じ方から合奏まで順番に組み立てていきます。全${readyParts}部${totalAll}節。各節は「読む → 練習問題」の順で進みます。${maxQuiz}問ぜんぶ正解すると、その節は「修了」になります。</p>
    ${resume}
    ${parts}`;
  view().querySelectorAll('.secbtn[data-part]').forEach(b=>{
    b.onclick = () => openSection(+b.dataset.part, +b.dataset.sec);
  });
  view().querySelectorAll('.part-head[data-toggle]').forEach(b=>{
    b.onclick = () => {
      const sec = b.closest('.part');
      const no = +b.dataset.toggle;
      const willOpen = sec.classList.contains('closed');
      view().querySelectorAll('.part').forEach(el=>el.classList.add('closed'));
      if(willOpen){ sec.classList.remove('closed'); OPEN = no; } else { OPEN = 0; }
    };
  });
  const rb = $('resumeBtn');
  if(rb) rb.onclick = () => openSection(LAST.p, LAST.s);
  window.scrollTo(0,0);
}

/* ---- 節 ---- */
function openSection(partNo, secNo){
  const part = PARTS.find(p=>p.no===partNo);
  const idx  = part.sections.findIndex(s=>s.no===secNo);
  const s    = part.sections[idx];
  CUR = {part:partNo, idx:idx};

  $('topbar').classList.remove('hidden');
  document.body.classList.add('reading');
  $('crumb').textContent = `第${partNo}部 ${part.title}` + (part.tag ? `（${part.tag}）` : '');
  saveLast(partNo, s.no);

  const prev = part.sections[idx-1];
  const next = part.sections[idx+1];

  view().className = 'fade';
  view().innerHTML = `
    <div class="sec-head">
      <div class="sec-no">第${partNo}部　${partNo}·${s.no}${isDone(partNo,s.no)?'<span class="sec-done">修了</span>':''}</div>
      <h2 class="sec-ttl">${esc(s.title)}</h2>
    </div>
    <div id="reading">
      <p class="lead">${s.lead}</p>
      <div class="goal"><h4>この節でできるようになること</h4><p>${esc(s.goal||'')}</p></div>
      <div class="body">${s.blocks.map(renderBlock).join('')}</div>
    </div>
    <div class="quiz" id="quiz"></div>
    <div class="secnav" id="secnav">
      ${prev ? `<button type="button" id="prevBtn"><span class="dir">← 前の節</span>${esc(prev.title)}</button>` : '<span style="flex:1"></span>'}
      ${next ? `<button type="button" class="next" id="nextBtn"><span class="dir">次の節 →</span>${esc(next.title)}</button>` : '<span style="flex:1"></span>'}
    </div>`;

  bindPlays();
  decorateTuplets();
  decorateMarks();
  wpHydrate(view());
  wpWrap(view());
  showQuizGate(s);
  if(prev) $('prevBtn').onclick = () => openSection(partNo, prev.no);
  if(next) $('nextBtn').onclick = () => openSection(partNo, next.no);
  NAV = {prev: prev ? [partNo, prev.no] : null, next: next ? [partNo, next.no] : null};
  updateReadBar();
  window.scrollTo(0,0);
  // 節を開いたら見出しにフォーカスを移す（キーボードと読み上げのため）
  const h = view().querySelector('.sec-ttl');
  if(h){ h.setAttribute('tabindex','-1'); }
}

/* ---- 譜例の再生 ---- */
let PLAYING = false;
function bindPlays(){
  view().querySelectorAll('.playbtn').forEach(btn=>{
    btn.onclick = () => {
      if(PLAYING) return;
      const id  = btn.dataset.staff;
      const box = $(id);
      const holder = view().querySelector('.seqdata[data-for="'+id+'"]');
      if(!box || !holder) return;
      let seq;
      try{ seq = JSON.parse(holder.textContent); }catch(e){ return; }
      PLAYING = true;
      box.classList.add('playing');
      view().querySelectorAll('.playbtn').forEach(b=>b.disabled = true);
      const bpm = +btn.dataset.bpm || 84;
      // playStaffBar が内部で playSequence を呼ぶため、ここでは重ねて呼ばない
      playStaffBar(seq, bpm, box, () => {
        PLAYING = false;
        box.classList.remove('playing');
        view().querySelectorAll('.playbtn').forEach(b=>b.disabled = false);
      });
    };
  });
}


/* ============================================================
   聴き取り問題：音を鳴らして、4つの譜例から選ぶ
   quiz の項目に ear:{seq, opt, bpm, choices:[seq,...]} があれば
   選択肢を譜例として描き、設問に再生ボタンを付ける。
============================================================ */
let EAR_PLAYING = false;

// 選択肢は配列（seqのみ）でも {seq, opt} でも書ける
function earChoice(c, baseOpt){
  const seq = Array.isArray(c) ? c : c.seq;
  const opt = Object.assign({}, baseOpt || {}, Array.isArray(c) ? {} : (c.opt || {}));
  return {seq: normSeq(seq), opt: opt};
}

// 選択肢用の小さな譜例
function miniStaff(c, baseOpt){
  const x = earChoice(c, baseOpt);
  return `<div class="ministaff">${staffSVG(x.seq, x.opt)}</div>`;
}

// 設問の再生ボタン（正解の譜例を鳴らす。譜面は見せない）
function earPrompt(q){
  const id = 'ear' + Math.random().toString(36).slice(2,8);
  return `<div class="earbox" id="${id}">
      <p class="earlbl">音を聴いて、同じリズムの譜面を選んでください</p>
      <button class="btn earbtn" type="button" data-ear="${id}">もう一度聴く</button>
    </div>`;
}

function bindEar(q){
  const box = view().querySelector('.earbox');
  if(!box) return;
  const btn = box.querySelector('.earbtn');
  const play = () => {
    if(EAR_PLAYING) return;
    EAR_PLAYING = true;
    btn.disabled = true;
    box.classList.add('playing');
    const seq = earChoice(q.ear.choices[q.a], q.ear.opt).seq;
    const bpm = q.ear.bpm || 84;
    playSequence(seq, bpm, {accentFirst:true, countIn:true, onEnd:()=>{
      EAR_PLAYING = false;
      btn.disabled = false;
      box.classList.remove('playing');
    }});
  };
  btn.onclick = play;
  play();   // 出題と同時に一度鳴らす
}

/* ---- 演習 ---- */
// 本文（解説・到達目標）の表示を切り替える。演習中は隠して、答えが見えないようにする。
function setReading(show){
  const r = $('reading'), n = $('secnav');
  if(r) r.classList.toggle('hidden', !show);
  if(n) n.classList.toggle('hidden', !show);
}

// 演習の入口。ここを押すまで問題は出さない。
// のこっている問題（正解ずみを除いたもの）。全部解けていれば全問を返す。
function pendingOf(sec){
  const sv = solvedOf(CUR.part, sec.no);
  const rest = sec.quiz.map((_,i)=>i).filter(i => sv.indexOf(i) < 0);
  return rest.length ? rest : sec.quiz.map((_,i)=>i);
}

function showQuizGate(sec){
  setReading(true);
  QUIZ = false;
  const box = $('quiz');
  const all  = sec.quiz.length;
  const nSol = solvedOf(CUR.part, sec.no).length;
  const rest = all - nSol;
  const done = isDone(CUR.part, sec.no);

  let msg, label;
  if(done){
    msg = `この節は修了しています。もう一度${all}問すべてを解き直せます。`;
    label = 'もう一回やる';
  }else if(nSol > 0){
    msg = `${all}問のうち${nSol}問は正解ずみです。<b>のこり${rest}問</b>だけ解きます。`;
    label = `のこり${rest}問を解く`;
  }else{
    msg = `ここまでの内容を${all}問でチェックします。3問ぜんぶ正解で修了です。`;
    label = 'やってみる';
  }
  box.innerHTML = `
    <div class="qstart">
      <h3>演習</h3>
      <p>${msg} 問題を解いているあいだは本文を隠します。</p>
      <div class="qnav">
        <button class="btn on-ink" type="button" id="qStart">${label}</button>
        ${nSol > 0 && !done ? '<button class="btn on-ink ghost" type="button" id="qAll">最初から全部</button>' : ''}
      </div>
    </div>`;
  // 修了ずみの節は、解き直しのたびに全問を出す
  $('qStart').onclick = () => {
    if(done) clearSolved(CUR.part, sec.no);
    startQuiz(sec);
  };
  const ga = $('qAll');
  if(ga) ga.onclick = () => { clearSolved(CUR.part, sec.no); startQuiz(sec); };
}

function startQuiz(sec){
  const box = $('quiz');
  const list = pendingOf(sec);                  // この回に出す問題の番号
  const state = {i:0, ok:0, list:list};
  setReading(false);
  QUIZ = true;
  window.scrollTo(0,0);

  function bar(){
    return `<div class="qprog">${list.map((_,i)=>
      `<i class="${i<state.i?'on':(i===state.i?'cur':'')}"></i>`).join('')}</div>`;
  }

  function draw(){
    const q = sec.quiz[list[state.i]];
    const isEar = !!q.ear;
    const optHTML = isEar
      ? q.ear.choices.map((c,i)=>
          `<button class="opt opt-staff" type="button" data-i="${i}"><span class="kbd">${'ABCD'[i]||''}</span>${miniStaff(c, q.ear.opt)}</button>`).join('')
      : q.opts.map((o,i)=>
          `<button class="opt" type="button" data-i="${i}"><span class="kbd">${'ABCD'[i]||''}</span><span>${esc(o)}</span></button>`).join('');
    box.innerHTML = `
      <div class="qcard">
        <div class="qbanner"><h3>${isEar ? '聴き取り' : '演習'}</h3><span class="qmeta">${state.i+1} / ${list.length}</span></div>
        <div class="qbody">
          ${bar()}
          <p class="qtext">${esc(q.q)}</p>
          ${isEar ? earPrompt(q) : ''}
          <div class="opts${isEar ? ' opts-staff' : ''}">${optHTML}</div>
          <div id="ansBox"></div>
        </div>
      </div>`;
    if(isEar) bindEar(q);
    box.querySelectorAll('.opt').forEach(b=>{
      b.onclick = () => answer(+b.dataset.i, q);
    });
  }

  function answer(pick, q){
    const ok = pick === q.a;
    if(ok){ state.ok++; addSolved(CUR.part, sec.no, list[state.i]); }
    const eb = box.querySelector('.earbtn');
    if(eb) eb.disabled = false;
    box.querySelectorAll('.opt').forEach((b,i)=>{
      b.disabled = true;
      if(i === pick){
        b.classList.add(ok ? 'pick-ok' : 'pick-ng');
        b.insertAdjacentHTML('beforeend', `<span class="tagmk">${ok ? '正解' : 'ちがう'}</span>`);
      }
      if(!ok && i === q.a){
        b.classList.add('reveal');
        b.insertAdjacentHTML('beforeend', '<span class="tagmk">こたえ</span>');
      }
    });
    const last = state.i === list.length - 1;
    $('ansBox').innerHTML = `
      <div class="ans ${ok?'ok':'ng'}">
        <span class="verdict">${ok?'正解':'もう一歩'}</span>${esc(q.exp)}</div>
      <div class="qnav">
        <button class="btn" type="button" id="qNext">${last?'結果を見る':'つぎの問題'}</button>
        <span class="kbdhint">Enter</span>
      </div>`;
    $('qNext').onclick = () => {
      if(last){ finish(); } else { state.i++; draw(); }
    };
  }

  function finish(){
    const all   = sec.quiz.length;
    const nSol  = solvedOf(CUR.part, sec.no).length;   // 通算で正解した数
    const rest  = all - nSol;
    const perfect = nSol === all;
    if(perfect) markDone(CUR.part, sec.no);
    box.innerHTML = `
      <div class="qcard">
        <div class="qbanner"><h3>演習</h3><span class="qmeta">${nSol} / ${all}</span></div>
        <div class="qbody">
        <div class="result">
          <p class="pct">${Math.round(nSol/all*100)}<span style="font-size:.45em">%</span></p>
          <p class="big">${nSol} / ${all} 問正解</p>
          <p class="sm">${perfect
            ? 'この節は修了です。目次に「修了」が付きました。'
            : `のこり${rest}問です。まちがえた問題だけをもう一度解けます。`}</p>
          <div class="qnav">
            <button class="btn" type="button" id="qRetry">${perfect ? 'もう一回やる' : `のこり${rest}問を解く`}</button>
            <button class="btn ghost" type="button" id="qBack">本文に戻る</button>
          </div>
        </div>
        </div>
      </div>`;
    $('qRetry').onclick = () => {
      if(perfect) clearSolvedForReview();
      startQuiz(sec);
    };
    $('qBack').onclick  = () => { showQuizGate(sec); window.scrollTo(0,0); };
  }

  // 修了ずみの節をもう一度やるときは、その回だけ全問を出す（修了は取り消さない）
  function clearSolvedForReview(){ clearSolved(CUR.part, sec.no); }

  draw();
}

/* ---- 読み進みの表示 ---- */
function updateReadBar(){
  const fill = $('readFill');
  if(!fill) return;
  if(!CUR){ fill.style.width = '0'; return; }
  const doc = document.documentElement;
  const max = doc.scrollHeight - window.innerHeight;
  const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  fill.style.width = (p * 100) + '%';
}

/* ---- キーボード操作 ---- */
function onKey(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;

  if(QUIZ){
    // 演習中：1〜4 で選択、Enter で次へ
    const idx = ['1','2','3','4'].indexOf(e.key);
    if(idx >= 0){
      const opts = view().querySelectorAll('.opt:not([disabled])');
      if(opts[idx]){ e.preventDefault(); opts[idx].click(); }
      return;
    }
    if(e.key === 'Enter'){
      const nx = $('qNext') || $('qRetry');
      if(nx){ e.preventDefault(); nx.click(); }
    }
    return;
  }
  if(!CUR){ return; }
  if(e.key === 'ArrowRight' && NAV.next){ e.preventDefault(); openSection(NAV.next[0], NAV.next[1]); }
  if(e.key === 'ArrowLeft'  && NAV.prev){ e.preventDefault(); openSection(NAV.prev[0], NAV.prev[1]); }
  if(e.key === 'Escape'){ e.preventDefault(); renderToc(); }
  if(e.key === 'Enter'){
    const st = $('qStart');
    if(st){ e.preventDefault(); st.click(); }
  }
}

/* ============================================================
   起動
============================================================ */
function boot(){
  document.title = APP_NAME;
  const sr = $('appTitle').querySelector('.sr');
  if(sr) sr.textContent = APP_NAME;
  $('appSub').textContent = APP_SUB;
  drawLogo($('logo'));
  loadProg();
  loadSolved();
  loadLast();
  $('backBtn').onclick = renderToc;
  window.addEventListener('scroll', updateReadBar, {passive:true});
  window.addEventListener('resize', updateReadBar);
  document.addEventListener('keydown', onKey);
  renderToc();
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
}else{ boot(); }

/* 自動検証から参照するための公開（画面の動作には影響しません） */
// 音源の出典を画面に出す（ドラムは表記が必要）
(function(){
  function put(){
    var S=(window.DS&&DS.sound), box=document.getElementById('credits');
    if(!S||!box||!S.creditsHtml) return;
    var html=S.creditsHtml(['drums']);
    if(html) box.innerHTML=html;
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',put); else put();
})();

window.APP = {PARTS, openSection, renderToc, isDone, normSeq, T, DUR, barTickOf, startQuiz, showQuizGate, onKey, updateReadBar, solvedOf, pendingOf, clearSolved, earChoice};
